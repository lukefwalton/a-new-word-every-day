name: Checks

# Config guardrails that don't need Xcode. Validates that the App Group
# identifier in project.yml matches the constant in Shared/AppGroup.swift, so the
# app and the widget can never drift onto two different on-device stores, and that
# the bundled corpus is well-formed. Companion to ios-tests.yml.
#
# words.json is assembled by scripts/build_corpus.py from the hand-authored,
# CC0 scripts/corpus_source.json — no external data, no heavy deps — so CI both
# validates structure and confirms the file is up to date with its source.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config-guardrails:
    name: Config guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored design system integrity (accidental-drift guard)
        run: bash scripts/check_designsystem_sync.sh
      - name: App Group identifier sync (project.yml ↔ Swift)
        run: bash scripts/check_appgroup_sync.sh
      - name: Bundled typeface list sync (Swift ↔ plists ↔ fetch script)
        run: bash scripts/check_fonts_sync.sh
      - name: Corpora regenerate deterministically
        run: |
          python3 scripts/build_corpus.py
          python3 scripts/build_corpus.py --lang ja
          # git status --porcelain (unlike git diff) also catches a generated
          # corpus that was never committed — untracked output must fail too.
          CHANGED=$(git status --porcelain WordOfTheDay/Resources/words.json WordOfTheDay/Resources/words_ja.json)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo "::error::a bundled corpus is out of date or untracked — run scripts/build_corpus.py (and --lang ja) and commit the output."
            exit 1
          fi
      - name: Corpora are well-formed (words.json, words_ja.json)
        run: |
          python3 - <<'PY'
          import json, sys
          from collections import Counter
          errors = []
          all_ids = []

          def check(path, valid_pos, min_len, reading, lang, bands):
              words = json.load(open(path, encoding="utf-8"))
              if not isinstance(words, list) or len(words) < min_len:
                  sys.exit(f"::error::{path} looks too small ({len(words) if isinstance(words, list) else 'n/a'}) — accidental content drop?")
              ids = [w["id"] for w in words]
              all_ids.extend(ids)
              if not all(isinstance(i, int) and i > 0 for i in ids):
                  errors.append(f"{path}: ids must be positive integers")
              if len(set(ids)) != len(ids):
                  errors.append(f"{path}: duplicate ids")
              names = set()
              for w in words:
                  tag = f"{path} id={w.get('id')}"
                  if not str(w.get("word", "")).strip(): errors.append(f"{tag}: blank word")
                  if not str(w.get("definition", "")).strip(): errors.append(f"{tag}: blank definition")
                  if w.get("pos") not in valid_pos: errors.append(f"{tag}: bad pos {w.get('pos')!r}")
                  if w.get("band") not in bands: errors.append(f"{tag}: band out of range")
                  if reading and "reading" in w and w["reading"] == w["word"]:
                      errors.append(f"{tag}: redundant reading should be omitted")
                  if w.get("lang") != lang:
                      errors.append(f"{tag}: lang must be {lang!r}, got {w.get('lang')!r}")
                  names.add(w.get("word"))
              if len(names) != len(words):
                  errors.append(f"{path}: duplicate headwords")
              lo, hi = min(bands), max(bands)
              counts = Counter(w["band"] for w in words)
              if set(counts) != bands:
                  errors.append(f"{path}: every difficulty band ({lo}..{hi}) must be represented")
              # Selection is exact-band (DailySelector.eligible), so each band is
              # a pool on its own — a thin one repeats fast, an empty one trips
              # the defensive whole-corpus fallback.
              thin = {b: n for b, n in counts.items() if b in bands and n < 150}
              if thin:
                  errors.append(f"{path}: bands too thin for their own pool: {dict(sorted(thin.items()))}")
              print(f"{path} OK — {len(words)} entries, bands {lo}..{hi} present")

          # English omits the lang key (pre-multilanguage compatibility); every
          # other corpus must tag each entry so Word.language resolves correctly.
          # English runs to band 6 ("Arcane"); Japanese stops at 5 — its bands
          # *are* JLPT N5…N1.
          check("WordOfTheDay/Resources/words.json", {"n", "v", "adj", "adv"}, 1000, reading=False, lang=None,
                bands={1, 2, 3, 4, 5, 6})
          check("WordOfTheDay/Resources/words_ja.json", {"n", "v", "adj", "adv", "expr"}, 5000, reading=True, lang="ja",
                bands={1, 2, 3, 4, 5})
          if len(set(all_ids)) != len(all_ids):
              errors.append("ids collide across languages — starred/review state is one global id-keyed map")
          if errors:
              sys.exit("::error::corpus invalid:\n" + "\n".join(errors[:50]))
          PY
