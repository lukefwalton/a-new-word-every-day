name: Word suggestion
description: Suggest a word for the English or Japanese corpus.
labels: ["corpus"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a word is the most useful contribution you can make. Definitions
        must be **original** — no copied dictionary text.

        - **English** entries are dedicated to the **public domain (CC0)**. Edit
          `scripts/corpus_source.json` or open a PR.
        - **Japanese** headwords/readings/levels derive from Tanos (**CC BY**); only
          suggest **definition** improvements or report data issues unless you're
          following the attribution path in [NOTICE](NOTICE). See
          `scripts/corpus_source_ja.json`.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Japanese
    validations:
      required: true
  - type: input
    id: word
    attributes:
      label: Word
      placeholder: "e.g. laconic (EN) or 食べる (JA)"
    validations:
      required: true
  - type: dropdown
    id: pos
    attributes:
      label: Part of speech
      options:
        - noun (n)
        - verb (v)
        - adjective (adj)
        - adverb (adv)
        - expression (expr) — Japanese only
    validations:
      required: true
  - type: input
    id: definition
    attributes:
      label: Definition (original, one line)
      placeholder: "e.g. using very few words"
    validations:
      required: true
  - type: dropdown
    id: band
    attributes:
      label: Difficulty band
      description: "English: 1 = accessible advanced … 5 = rarest. Japanese: 1 = JLPT N5 … 5 = N1."
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: true
